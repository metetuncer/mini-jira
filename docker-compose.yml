services:
  postgres:
    image: postgres:16-alpine
    container_name: minijira-postgres
    environment:
      POSTGRES_DB: minijira
      POSTGRES_USER: minijira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - minijira_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minijira -d minijira"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minijira_pg_data:
